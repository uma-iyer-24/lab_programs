<!DOCTYPE html>
<html>
    <head>
        <title>Change Colour</title>
    </head>
    <body style="text-align:center">
        <h1>Change Colour</h1>
        <h2>Click Button to Change BG Colour</h2>
        <button onclick="changeColor()"> Click Me </button>
        <script>
            function changeColor()
            {
                document.body.style.backgroundColor = "lightgreen";
            }
        </script>
    </body>
</html>
