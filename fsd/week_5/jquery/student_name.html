<html>
<head>
    <title>Display name</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
     <script>
        $(document).ready(function(){
            $("#show").click(function(){
                let name = "Uma";
                $("#sname").text(name);
            })
        })
    </script>
</head>
<body style="text-align:center">
    <h1 id="sname"></h1>
    <button id = "show">Click me to display name</button>
</body>
</html>
