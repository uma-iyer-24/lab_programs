<!DOCTYPE html>
<html lang="en">
    <body style="text-align: center">
        <h1>Keyboard Events</h1>
        <input type="text" id="keyInput" placeholder="Press a key here">
        <p id="eventMessage" style="font-weight: bold; margin-top: 15px;">No key event yet</p>
        <p id="keyDetails" style="color: #333;">Press a key to see the details.</p>
        <script>
            const input = document.getElementById('keyInput');
            const eventMessage = document.getElementById('eventMessage');
            const keyDetails = document.getElementById('keyDetails');
            function showEvent(eventName, e) {
                eventMessage.textContent = eventName + ' triggered';
                keyDetails.textContent = 'Key: ' + e.key + ' | Code: ' + e.code;
            }
            input.addEventListener('keydown', function (e) {
                showEvent('keydown', e);
            });
            input.addEventListener('keypress', function (e) {
                showEvent('keypress', e);
            });
            input.addEventListener('keyup', function (e) {
                showEvent('keyup', e);
            });
        </script>
    </body>
</html>
