<!DOCTYPE html>
<html lang="en">
    <body style="text-align: center; font-family: Arial;">
        <header>
            <h4>Loading Events</h4>
        </header>

        <p id="status" style="font-weight: bold; margin-top: 20px;">Page is loading...</p>
        <p id="details" style="color: #333;">The page will show a short loading sequence before finishing.</p>
        <script>
            const status = document.getElementById('status');
            const details = document.getElementById('details');

            function showEvent(eventName, message) {
                status.textContent = eventName + ' triggered';
                details.textContent = message;
            }

            setTimeout(function () {
                showEvent('DOMContentLoaded', 'HTML is ready and the page content has been parsed.');
            }, 1000);

            setTimeout(function () {
                showEvent('load', 'All resources are finished loading and the page is complete.');
            }, 2500);

            window.addEventListener('beforeunload', function () {
                showEvent('beforeunload', 'The page is about to be unloaded.');
            });
        </script>
    </body>
</html>
