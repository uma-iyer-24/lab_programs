<!DOCTYPE html>
<html lang="en">
    <body style="text-align: center">
        <header>
            <h4>Mouse Events</h4>
        </header>
        <div id="mouseArea" style="width: 320px; height: 220px; margin: 20px auto; border: 1px solid black; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 10px;">
            <p>Try clicking, double-clicking, right-clicking, and moving the mouse over this area.</p>
        </div>
        <p id="eventLog" style="font-weight: bold;">Event log:</p>
        <p id="singleEvent" style="font-weight: bold;">No event yet</p>
        <script>
            let mouseArea = document.getElementById('mouseArea');
            let singleEvent = document.getElementById('singleEvent');
            function logEvent(eventName) {
                singleEvent.textContent = eventName + ' triggered';
            }
            mouseArea.addEventListener('click', function () {
                logEvent('click');
            });
            mouseArea.addEventListener('contextmenu', function (e) {
                e.preventDefault();
                logEvent('contextmenu');
            });
            mouseArea.addEventListener('dblclick', function () {
                logEvent('dblclick');
            });
            mouseArea.addEventListener('mousedown', function () {
                logEvent('mousedown');
            });
            mouseArea.addEventListener('mouseenter', function () {
                this.style.backgroundColor = 'lightgreen';
                logEvent('mouseenter');
            });
            mouseArea.addEventListener('mouseleave', function () {
                this.style.backgroundColor = 'white';
                logEvent('mouseleave');
            });
            mouseArea.addEventListener('mousemove', function () {
                logEvent('mousemove');
            });
            mouseArea.addEventListener('mouseout', function () {
                logEvent('mouseout');
            });
            mouseArea.addEventListener('mouseover', function () {
                logEvent('mouseover');
            });
            mouseArea.addEventListener('mouseup', function () {
                logEvent('mouseup');
            });
        </script>
    </body>
</html>
