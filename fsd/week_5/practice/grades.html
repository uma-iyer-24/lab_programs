<html>
<head>
    <title>Calculate Marks</title>
</head>
<body style="text-align:center">
    <h1>Registration Form</h1>
    <form onsubmit="return validateForm()">
        <label>Student Name:</label>
        <input type="text" id="stdname" name="stdname" required><br><br>

        <label>Roll No:</label>
        <input type="text" id="rno" name="rno" required><br><br>

        <label>Subject 1:</label>
        <input type="number" id="s1" name="s1"><br><br>

        <label>Subject 2:</label>
        <input type="number" id="s2" name="s2" required><br><br>

        <label>Subject 3:</label>
        <input type="number" id="s3" name="s3" required><br><br>

        <label>Subject 4:</label>
        <input type="number" id="s4" name="s4" required><br><br>

        <label>Subject 5:</label>
        <input type="number" id="s5" name="s5" required><br><br>

        <button type="submit">Submit</button>
    </form>

    <script>
        function validateForm() {
            let sname = document.getElementById("stdname").value;
            let rno = document.getElementById("rno").value;
            let s1 = Number(document.getElementById("s1").value);
            let s2 = Number(document.getElementById("s2").value);
            let s3 = Number(document.getElementById("s3").value);
            let s4 = Number(document.getElementById("s4").value);
            let s5 = Number(document.getElementById("s5").value);

            let total = s1+s2+s3+s4+s5;
            let p = (total/500) * 100;
            var g;
            if(total>=90){
                g = 'A';
            } else if(total>=80 && total <90){
                g = 'B';
            } else if(total>=70 && total<80){
                g = 'C';
            } else if(total>=60 && total<70){
                g = 'D';
            } else {
                g = 'Fail';
            }

            alert(`Student Name: ${sname}\nRoll No: ${rno}\nTotal Marks: ${total}\nPercentage: ${p.toFixed(2)}%\nGrade: ${g}\n`);
            return false;
        }
    </script>
</body>
</html>
